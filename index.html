                const gain = audioCtx.createGain();
                osc.type = "sine";
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.05);

              </div>

              <div>
                <label class="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-1">Soy...</label>
                <div class="grid grid-cols-2 gap-3">
                  <button type="button" onclick="playClickSound(); selectGender('chico')" id="btnChico" class="py-3 rounded-2xl border-2 font-bold text-sm transition-all bg-sky-50 border-sky-400 text-sky-600">
                    Chico 👦
                  </button>
                  <button type="button" onclick="playClickSound(); selectGender('chica')" id="btnChica" class="py-3 rounded-2xl border-2 font-bold text-sm transition-all bg-white border-slate-200 text-slate-600">
                    Chica 👧
                  </button>
                </div>
              </div>

              <button onclick="playClickSound(); startCreatorQuiz()" class="w-full bg-gradient-to-r from-sky-400 to-blue-500 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-sky-200 active:scale-95 transition-transform mt-2">
                Crear mi reto 🚀
              </button>
            </div>
          </div>
        `;
            } else if (state.step === 'creator_quiz') {
                const q = state.availableQuestions[state.currentQuestionIdx];
                const answeredCount = Object.keys(state.creatorAnswers).length;
                const formattedQuestion = q.question.replace('{nom}', state.userName);
                app.innerHTML = `
          <div class="glass-card p-5 rounded-3xl shadow-xl space-y-3">
            <div class="flex items-center justify-between text-xs font-bold text-sky-600 bg-sky-100/70 px-3.5 py-1.5 rounded-full w-max">
              Respondidas: ${answeredCount} de ${TARGET_QUESTIONS}
            </div>
            <h2 class="text-lg font-bold text-slate-800 leading-snug">${formattedQuestion}</h2>
            
            <div class="grid grid-cols-2 gap-2.5 pt-1 max-h-[58vh] overflow-y-auto pr-1">
              ${q.options.map(opt => `
                <button onclick="playClickSound(); selectCreatorAnswer(${q.id}, '${opt.id}')" class="group bg-white rounded-2xl p-3 shadow-sm border border-slate-100 flex flex-col items-center hover:border-sky-400 active:scale-95 transition-all text-center">
                  <div class="w-14 h-14 ${opt.bg} rounded-2xl flex items-center justify-center text-3xl mb-2 shadow-inner group-hover:scale-110 transition-transform">
                    ${opt.icon}
                  </div>
                  <span class="text-xs font-bold text-slate-700 leading-tight">${opt.label}</span>
                </button>
              `).join('')}
            </div>

            <div class="pt-2">
              <button onclick="playClickSound(); skipCreatorQuestion()" class="w-full py-2.5 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-500 font-bold text-xs active:scale-95 transition-all">
                Saltar esta pregunta ⏭️
              </button>
            </div>
          </div>
        `;
            } else if (state.step === 'share_dashboard') {
                // PANTALLA IDÈNTICA A LA CAPTURA DE PANTALLA AMB TOTS ELS BOTONS SOCIALS
                const shareLink = `${window.location.origin}${window.location.pathname}?id=${state.createdQuizId}`;
                const encodedUrl = encodeURIComponent(shareLink);
                const encodedMsg = encodeURIComponent(`¿Me vas a bloquear o me conoces de verdad? 👀 Descúbrelo aquí: ${shareLink}`);

                app.innerHTML = `
          <div class="glass-card p-6 rounded-3xl shadow-2xl text-center space-y-4">
            
            <!-- Capçalera divertida d'amistats falses -->
            <div class="space-y-1">
              <div class="text-4xl mb-1">🧸📱</div>
              <h2 class="text-2xl font-black text-slate-800 leading-tight">
                comparte tu <span class="text-sky-500 underline decoration-sky-300">enlace</span> 🔗<br/>
                <span class="text-sm font-bold text-slate-400">— y —</span><br/>
                descubre tus amistades <span class="bg-pink-100 text-pink-600 px-2 py-0.5 rounded-lg">falsas</span> 🎭
              </h2>
            </div>

            <!-- Caixa d'enllaç per copiar -->
            <div class="bg-white/80 border border-slate-200 rounded-2xl p-2 flex items-center justify-between shadow-inner">
              <div class="flex items-center space-x-2 pl-2 overflow-hidden text-slate-500 text-xs">
                <span>🔗</span>
                <span class="truncate">${shareLink}</span>
              </div>
              <button onclick="playClickSound(); navigator.clipboard.writeText('${shareLink}'); alert('¡Enlace copiado!');" class="bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs font-bold px-3 py-2 rounded-xl flex items-center space-x-1 shrink-0 active:scale-95 transition-transform">
                <span>📋</span>
                <span>Copiar</span>
              </button>
            </div>

            <!-- Botó verd de WhatsApp -->
            <a href="https://wa.me/?text=${encodedMsg}" target="_blank" onclick="playClickSound()" class="w-full flex items-center justify-center space-x-2 bg-gradient-to-r from-emerald-400 to-green-500 hover:from-emerald-500 hover:to-green-600 text-white font-black py-4 rounded-2xl shadow-lg shadow-emerald-200 active:scale-95 transition-all text-base">
              <span class="text-xl">💬</span>
              <span>Compartir en WhatsApp</span>
            </a>

            <!-- Graella de xarxes socials -->
            <div class="grid grid-cols-2 gap-2.5 pt-1">
              <!-- Instagram -->
              <a href="https://instagram.com" target="_blank" onclick="playClickSound()" class="bg-white border border-slate-100 hover:border-pink-300 p-3 rounded-2xl shadow-sm flex items-center space-x-2.5 active:scale-95 transition-all">
                <span class="text-2xl">📸</span>
                <span class="text-xs font-bold text-slate-700">Instagram</span>
              </a>

              <!-- Snapchat -->
              <a href="https://snapchat.com" target="_blank" onclick="playClickSound()" class="bg-white border border-slate-100 hover:border-yellow-300 p-3 rounded-2xl shadow-sm flex items-center space-x-2.5 active:scale-95 transition-all">
                <span class="text-2xl">👻</span>
                <span class="text-xs font-bold text-slate-700">Snapchat</span>
              </a>

              <!-- Facebook -->
              <a href="https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}" target="_blank" onclick="playClickSound()" class="bg-white border border-slate-100 hover:border-blue-300 p-3 rounded-2xl shadow-sm flex items-center space-x-2.5 active:scale-95 transition-all">
                <span class="text-2xl">📘</span>
                <span class="text-xs font-bold text-slate-700">Facebook</span>
              </a>

              <!-- Messenger -->
              <a href="fb-messenger://share/?link=${encodedUrl}" target="_blank" onclick="playClickSound()" class="bg-white border border-slate-100 hover:border-sky-300 p-3 rounded-2xl shadow-sm flex items-center space-x-2.5 active:scale-95 transition-all">
                <span class="text-2xl">⚡</span>
                <span class="text-xs font-bold text-slate-700">Messenger</span>
              </a>

              <!-- Telegram -->
              <a href="https://t.me/share/url?url=${encodedUrl}&text=${encodedMsg}" target="_blank" onclick="playClickSound()" class="bg-white border border-slate-100 hover:border-sky-300 p-3 rounded-2xl shadow-sm flex items-center space-x-2.5 active:scale-95 transition-all">
                <span class="text-2xl">✈️</span>
                <span class="text-xs font-bold text-slate-700">Telegram</span>
              </a>

              <!-- Otras apps -->
              <button onclick="playClickSound(); shareNative('${shareLink}')" class="bg-white border border-slate-100 hover:border-slate-300 p-3 rounded-2xl shadow-sm flex items-center space-x-2.5 active:scale-95 transition-all">
                <span class="text-2xl">🔗</span>
                <span class="text-xs font-bold text-slate-700">Otras apps</span>
              </button>
            </div>

            <!-- Botó blau destacat: Ver puntuaciones -->
            <div class="pt-2">
              <button onclick="playClickSound(); showScoreboard('${state.createdQuizId}', '${state.userName}')" class="w-full bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-600 hover:to-blue-700 text-white font-black py-3.5 rounded-2xl shadow-lg shadow-sky-200 active:scale-95 transition-all flex items-center justify-center space-x-2">
                <span class="text-lg">🏆</span>
                <span>Ver puntuaciones</span>
              </button>
            </div>

          </div>
        `;
            } else if (state.step === 'scoreboard') {
                // PANTALLA DE RÀNQUING I PUNTUACIONS DELS AMICS
                app.innerHTML = `
          <div class="glass-card p-6 rounded-3xl shadow-xl space-y-4">
            <div class="flex items-center justify-between border-b border-slate-200 pb-3">
              <div>
                <h2 class="text-xl font-black text-slate-800">Puntuaciones 🏆</h2>
                <p class="text-xs text-slate-400">Reto de ${state.userName}</p>
              </div>
              <button onclick="playClickSound(); state.step = 'share_dashboard'; render();" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold px-3 py-1.5 rounded-xl">
                Volver
              </button>
            </div>

            <div id="scoresList" class="space-y-2 max-h-72 overflow-y-auto">
              <p class="text-xs text-slate-400 text-center py-4">Cargando respuestas...</p>
            </div>

            <div class="pt-2">
              <button onclick="playClickSound(); loadScores('${state.createdQuizId}')" class="w-full py-2.5 text-xs font-bold bg-white border border-slate-200 text-slate-600 rounded-xl hover:bg-slate-50 active:scale-95 transition-transform">
                🔄 Actualizar lista
              </button>
            </div>
          </div>
        `;
                loadScores(state.createdQuizId);
            } else if (state.step === 'friend_intro') {
                // ENTRADA PER A L'AMIC QUE REP EL WHATSAPP
                app.innerHTML = `
          <div class="glass-card p-6 rounded-3xl shadow-xl text-center space-y-5">
            <div class="w-20 h-20 bg-pink-100 text-pink-500 rounded-2xl mx-auto flex items-center justify-center text-4xl">
              👀
            </div>
            <h1 class="text-2xl font-black text-slate-800">¿Cuánto conoces a <span class="text-pink-500">${state.targetQuiz.creator_name}</span>?</h1>
            <p class="text-xs text-slate-500">Responde a sus preguntas visuales y demuestra si eres un amigo de verdad o te va a bloquear.</p>
            <div class="space-y-3 pt-2">
              <input id="inputFriendName" type="text" placeholder="Tu nombre..." class="w-full px-4 py-3.5 rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-pink-400 font-semibold text-center text-slate-700 bg-white/90">
              <button onclick="playClickSound(); startFriendQuiz()" class="w-full bg-gradient-to-r from-pink-400 to-rose-500 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-pink-200 active:scale-95 transition-transform">Empezar el test 🎯</button>
            </div>
          </div>
        `;
            } else if (state.step === 'friend_quiz') {
                const q = state.friendAnsweredQuestions[state.currentQuestionIdx];
                const formattedQuestion = q.question.replace('{nom}', state.targetQuiz.creator_name);
                app.innerHTML = `
          <div class="glass-card p-5 rounded-3xl shadow-xl space-y-3">
            <div class="text-xs font-bold text-pink-600 bg-pink-100 px-3.5 py-1.5 rounded-full w-max">
              Pregunta ${state.currentQuestionIdx + 1} de ${state.friendAnsweredQuestions.length}
            </div>
            <h2 class="text-lg font-bold text-slate-800 leading-snug">${formattedQuestion}</h2>
            
            <div class="grid grid-cols-2 gap-2.5 pt-1 max-h-[58vh] overflow-y-auto pr-1">
              ${q.options.map(opt => `
                <button onclick="playClickSound(); selectFriendAnswer(${q.id}, '${opt.id}')" class="group bg-white rounded-2xl p-3 shadow-sm border border-slate-100 flex flex-col items-center hover:border-pink-400 active:scale-95 transition-all text-center">
                  <div class="w-14 h-14 ${opt.bg} rounded-2xl flex items-center justify-center text-3xl mb-2 shadow-inner group-hover:scale-110 transition-transform">
                    ${opt.icon}
                  </div>
                  <span class="text-xs font-bold text-slate-700 leading-tight">${opt.label}</span>
                </button>
              `).join('')}
            </div>
          </div>
        `;
            } else if (state.step === 'result') {
                // RESULTAT DE L'AMIC + BOTÓ PER FER EL SEU PROPI TEST
                app.innerHTML = `
          <div class="glass-card p-6 rounded-3xl shadow-xl text-center space-y-5">
            <div class="text-5xl">🏆</div>
            <h2 class="text-2xl font-black text-slate-800">¡Has sacado ${state.score} / ${state.friendAnsweredQuestions.length}!</h2>
            <p class="text-xs text-slate-500">Tus respuestas y tu nota se han enviado automáticamente al ranking de ${state.targetQuiz.creator_name}.</p>
            
            <div class="pt-4 border-t border-slate-200/60 space-y-3">
              <h3 class="text-base font-bold text-slate-800">¿Quieres retarle tú a él?</h3>
              <p class="text-xs text-slate-400">Crea tu propio test para ver cuántas preguntas acierta sobre ti.</p>
              <button onclick="playClickSound(); revengeQuiz()" class="w-full bg-gradient-to-r from-sky-400 to-blue-500 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-sky-200 active:scale-95 transition-transform">
                Crear mi propio reto ⚔️
              </button>
            </div>
          </div>
        `;
            }
        }

        function selectGender(gender) {
            state.gender = gender;
            const btnChico = document.getElementById('btnChico');
            const btnChica = document.getElementById('btnChica');
            if (gender === 'chico') {
                btnChico.className = 'py-3 rounded-2xl border-2 font-bold text-sm transition-all bg-sky-50 border-sky-400 text-sky-600';
                btnChica.className = 'py-3 rounded-2xl border-2 font-bold text-sm transition-all bg-white border-slate-200 text-slate-600';
            } else {
                btnChico.className = 'py-3 rounded-2xl border-2 font-bold text-sm transition-all bg-white border-slate-200 text-slate-600';
                btnChica.className = 'py-3 rounded-2xl border-2 font-bold text-sm transition-all bg-pink-50 border-pink-400 text-pink-600';
            }
        }

        function startCreatorQuiz() {
            const name = document.getElementById('inputName').value.trim();
            if (!name) return alert('Por favor, escribe tu nombre');
            state.userName = name;
            state.availableQuestions = shuffleArray(ALL_QUESTIONS);
            state.currentQuestionIdx = 0;
            state.creatorAnswers = {};
            state.step = 'creator_quiz';
            render();
        }

        function selectCreatorAnswer(questionId, optionId) {
            state.creatorAnswers[questionId] = optionId;
            evaluateNextCreatorQuestion();
        }

        function skipCreatorQuestion() {
            evaluateNextCreatorQuestion();
        }

        function evaluateNextCreatorQuestion() {
            const answeredCount = Object.keys(state.creatorAnswers).length;
            if (answeredCount >= TARGET_QUESTIONS) {
                finishCreatorQuiz();
                return;
            }

            if (state.currentQuestionIdx + 1 < state.availableQuestions.length) {
                state.currentQuestionIdx++;
                render();
            } else {
                finishCreatorQuiz();
            }
        }

        async function finishCreatorQuiz() {
            app.innerHTML = `<div class="glass-card p-8 rounded-3xl text-center font-bold text-slate-600">Generando tu reto... ⏳</div>`;
            const uniqueId = Math.random().toString(36).substring(2, 9);
            state.createdQuizId = uniqueId;

            const { error } = await db.from('quizzes').insert({
                id: uniqueId,
                creator_name: state.userName,
                answers: state.creatorAnswers,
                referred_by: refId || null
            });

            if (error) {
                alert('Error al guardar: ' + error.message);
                return;
            }

            state.step = 'share_dashboard';
            render();
        }

        // Compartició nativa per a mòbils
        function shareNative(url) {
            if (navigator.share) {
                navigator.share({
                    title: `¿Cuánto conoces a ${state.userName}?`,
                    text: `¿Me vas a bloquear o me conoces de verdad? 👀 Descúbrelo aquí:`,
                    url: url
                }).catch(() => { });
            } else {
                navigator.clipboard.writeText(url);
                alert('Enlace copiado al portapapeles');
            }
        }

        // Carregar puntuacions de la base de dades
        async function showScoreboard(quizCode, creatorName) {
            state.createdQuizId = quizCode;
            state.userName = creatorName || state.userName;
            state.step = 'scoreboard';
            render();
        }

        async function loadScores(quizCode) {
            const listEl = document.getElementById('scoresList');
            if (!listEl) return;
            listEl.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">Actualizando datos...</p>`;

            const { data, error } = await db.from('responses').select('*').eq('quiz_id', quizCode).order('score', { ascending: false });

            if (error || !data || data.length === 0) {
                listEl.innerHTML = `<p class="text-xs text-slate-400 text-center py-6">Todavía ningún amigo ha completado tu test.<br/>¡Comparte el enlace por WhatsApp!</p>`;
                return;
            }

            listEl.innerHTML = data.map((r, idx) => `
        <div class="p-3 bg-white/90 border border-slate-100 rounded-2xl flex items-center justify-between shadow-sm">
          <div class="flex items-center space-x-2.5">
            <span class="text-sm font-black ${idx === 0 ? 'text-amber-500' : 'text-slate-400'}">#${idx + 1}</span>
            <span class="text-xs font-bold text-slate-800">${r.friend_name}</span>
          </div>
          <span class="text-xs font-black bg-sky-100 text-sky-700 px-2.5 py-1 rounded-full">
            ${r.score} / ${r.total_questions}
          </span>
        </div>
      `).join('');
        }

        function startFriendQuiz() {
            const name = document.getElementById('inputFriendName').value.trim();
            if (!name) return alert('Por favor, escribe tu nombre');
            state.friendName = name;
            state.currentQuestionIdx = 0;
            state.step = 'friend_quiz';
            render();
        }

        function selectFriendAnswer(questionId, optionId) {
            state.friendAnswers[questionId] = optionId;
            if (state.currentQuestionIdx + 1 < state.friendAnsweredQuestions.length) {
                state.currentQuestionIdx++;
                render();
            } else {
                finishFriendQuiz();
            }
        }

        async function finishFriendQuiz() {
            app.innerHTML = `<div class="glass-card p-8 rounded-3xl text-center font-bold text-slate-600">Calculando puntuación... ⏳</div>`;
            let score = 0;
            state.friendAnsweredQuestions.forEach(q => {
                if (state.friendAnswers[q.id] === state.targetQuiz.answers[q.id]) {
                    score++;
                }
            });
            state.score = score;

            await db.from('responses').insert({
                quiz_id: state.targetQuiz.id,
                friend_name: state.friendName,
                score: score,
                total_questions: state.friendAnsweredQuestions.length
            });

            state.step = 'result';
            render();
        }

        function revengeQuiz() {
            // Obre la creació del nou test guardant l'enllaç de referència de l'amic
            window.location.href = `${window.location.origin}${window.location.pathname}?ref=${state.targetQuiz.id}`;
        }

        init();
    </script>
</body>

</html>
